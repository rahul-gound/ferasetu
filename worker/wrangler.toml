# Cloudflare Worker config for the FeraSetu Worker API.
# This Worker implements the core shopkeeper routes backed by Cloudflare D1.

name = "ferasetu"
main = "index.js"
compatibility_date = "2025-06-01"

[vars]
WORKOS_CLIENT_ID = "client_01KZRE47KGSPK84HEP9WNBG9YY"
PAGES_ORIGIN = "https://ferasetu.com"
ADMIN_USER_IDS = "user_01M2FQ94TPQ7GQ18WNZ68EN50B"
WHATSAPP_CONNECTOR_URL = "https://wa.ferasetu.com"
WHATSAPP_INTERNAL_SECRET = "ferasetu_wa_secret_2026"

# D1 database binding.
[[d1_databases]]
binding = "DB"
database_name = "fera-shopkeeper"
database_id = "ac0e07fa-8183-4a99-b744-c095027f61d6"

# Durable Object for Realtime Synchronization
[durable_objects]
bindings = [
  { name = "REALTIME_HUB", class_name = "RealtimeHubDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RealtimeHubDO"]

# Observability configuration
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
